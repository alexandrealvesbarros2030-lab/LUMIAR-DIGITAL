
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumiar Digital</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#f5f7f4;
color:#183e2c;
font:16px Arial,sans-serif;
padding-bottom:95px
}

header{
background:linear-gradient(135deg,#123d2b,#32764e);
color:white;
text-align:center;
padding:30px 12px
}

header h1{margin:0}
header p{color:#ffe17a}

main{
max-width:800px;
margin:auto;
padding:16px
}

input{
width:100%;
padding:15px;
border:1px solid #ccc;
border-radius:12px;
font-size:16px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px
}

button,a{
cursor:pointer;
font:inherit
}

button{
border:0;
border-radius:12px;
padding:12px;
background:#f5cf52;
color:#174632;
font-weight:bold
}

.cat{
background:white;
min-height:110px;
border:1px solid #eee;
font-size:13px
}

.cat span{
display:block;
font-size:30px;
margin-bottom:10px
}

.banner{
background:#174632;
color:white;
text-align:center;
padding:24px;
border-radius:15px;
margin-top:24px
}

.banner button{
width:100%;
margin-top:12px
}

.entry{
background:white;
border-radius:15px;
padding:16px;
margin:12px 0;
border:1px solid #ddd
}

.entry img{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:10px
}

.entry a{
display:inline-block;
margin:8px;
color:#174632
}

.entry h3{
margin:12px 0
}

.entry p{
line-height:1.5;
overflow-wrap:anywhere
}

.profissional-card{
border:2px solid #32764e
}

.premium-card{
border:2px solid #e4bc36;
box-shadow:0 4px 12px #d6b42d22
}

.selo-premium{
display:inline-block;
background:#f5cf52;
color:#194c36;
padding:7px 12px;
border-radius:8px;
font-size:12px;
font-weight:bold;
margin-bottom:10px
}

.selo-profissional{
display:inline-block;
background:#194c36;
color:white;
padding:7px 12px;
border-radius:8px;
font-size:12px;
font-weight:bold;
margin-bottom:10px
}

.publicidade{
background:linear-gradient(135deg,#194c36,#32764e);
color:white;
padding:20px;
border:3px solid #f5cf52;
border-radius:18px;
margin:15px 0
}

.publicidade img{
width:100%;
max-height:220px;
object-fit:cover;
border-radius:12px;
margin-top:10px
}

.publicidade button{
width:100%;
margin-top:10px
}

.publicidade small{
color:#ffe17a
}

.contatos{
display:flex;
flex-wrap:wrap;
gap:8px;
margin:12px 0
}

.contatos a{
background:#edf4ed;
padding:10px;
border-radius:8px;
text-decoration:none;
font-size:14px;
margin:0
}

nav{
position:fixed;
bottom:0;
left:0;
background:white;
width:100%;
display:flex;
justify-content:space-around;
padding:12px 2px;
padding-bottom:calc(12px + env(safe-area-inset-bottom));
box-shadow:0 -2px 10px #0001;
z-index:100
}

nav button{
background:white;
font-size:12px;
padding:8px
}

small{color:#567}

.plano{
background:white;
border:1px solid #ddd;
border-top:6px solid #194c36;
border-radius:18px;
padding:24px;
margin:20px 0;
box-shadow:0 4px 12px #00000008
}

.plano h2{
text-align:center;
margin:10px 0
}

.preco{
font-size:36px;
font-weight:bold;
text-align:center;
margin:20px 0;
color:#194c36
}

.preco span{
font-size:15px;
font-weight:normal
}

.plano ul{
padding:0;
list-style:none;
line-height:1.8
}

.plano li{
padding:7px 0;
border-bottom:1px solid #eee
}

.plano button{
width:100%;
padding:16px;
margin-top:15px
}

.premium{
border-top-color:#f5cf52
}

.selo{
background:#194c36;
color:white;
text-align:center;
padding:9px;
border-radius:8px;
font-size:13px;
font-weight:bold
}

.aviso{
font-size:13px;
line-height:1.6;
color:#567;
text-align:center
}
</style>
</head>

<body>

<header>
<h1>🏔️ Lumiar Digital</h1>
<p>Tudo que você precisa, em um só lugar</p>
</header>

<main id="app"></main>

<nav>
<button onclick="home()">🏠 Início</button>
<button onclick="explore()">🧭 Explorar</button>
<button onclick="favorites()">♡ Favoritos</button>
<button onclick="profile()">👤 Perfil</button>
</nav>

<script>

const cats=[
'Pousadas e chalés',
'Restaurantes e bares',
'Cachoeiras',
'Comércio local',
'Delivery',
'Prestadores de serviços',
'Eventos',
'Promoções',
'Pontos turísticos'
];

const icons=[
'🏡','🍽️','💧','🏪','🛵',
'🔧','📅','🏷️','⛰️'
];

const empresas=[];

const app=document.getElementById('app');

let mode='home';

let fav=[];

try{
fav=JSON.parse(
localStorage.getItem('lumiarFav')||'[]'
);

if(!Array.isArray(fav))fav=[];

}catch(e){
fav=[];
}

fav=fav.map(String);

const norm=s=>String(s||'')
.normalize('NFD')
.replace(/[\u0300-\u036f]/g,'')
.toLowerCase();

function planoAtivo(e){

const plano=norm(e.plano).trim();

if(plano==='premium')return 'premium';

if(plano==='profissional')return 'profissional';

return 'basico';

}

function prioridade(e){

const plano=planoAtivo(e);

if(plano==='premium')return 3;

if(plano==='profissional')return 2;

return 1;

}

function ordenar(lista){

return [...lista].sort((a,b)=>{

const diferenca=prioridade(b)-prioridade(a);

if(diferenca!==0)return diferenca;

return String(a.nome||'').localeCompare(
String(b.nome||''),
'pt-BR'
);

});

}

async function carregarEmpresas(){

const campos=[
'id',
'nome',
'categoria',
'descricao',
'foto',
'endereco',
'horario',
'whatsapp',
'telefone',
'instagram',
'site',
'plano',
'aprovado',
'destaque'
].join(',');

const resposta=await fetch(
'https://fhclimiwecgxmgigibix.supabase.co/rest/v1/empresas?select='+campos+'&aprovado=eq.true',
{
cache:'no-store',
headers:{
apikey:'sb_publishable_8aRbVy84r3kuuPQh_Owz5w_lHu6v_oQ'
}
}
);

if(!resposta.ok){

throw new Error(
'Erro ao consultar empresas'
);

}

const dados=await resposta.json();

empresas.splice(
0,
empresas.length,
...ordenar(dados)
);

}

function el(tag,txt,parent=app){

const e=document.createElement(tag);

if(txt)e.textContent=txt;

parent.append(e);

return e;

}

function btn(txt,fn,parent=app){

const b=el('button',txt,parent);

b.type='button';

b.onclick=fn;

return b;

}

function reset(){

app.replaceChildren();

window.scrollTo(0,0);

}

function search(fn){

const i=el('input');

i.type='search';

i.placeholder=
'Buscar estabelecimentos ou categorias...';

i.oninput=()=>fn(i.value);

return i;

}

function corresponde(e,q){

return norm(
(e.nome||'')+' '+
(e.endereco||'')+' '+
(e.descricao||'')+' '+
(cats[Number(e.categoria)]||'')
).includes(norm(q));

}

function urlSegura(valor){

if(!valor)return '';

try{

let texto=String(valor).trim();

if(!/^https?:\/\//i.test(texto)){
texto='https://'+texto;
}

const url=new URL(texto);

if(
url.protocol!=='https:' &&
url.protocol!=='http:'
)return '';

return url.href;

}catch(e){

return '';

}

}

function link(txt,url,parent){

if(!url)return;

const a=el('a',txt,parent);

a.href=url;

a.target='_blank';

a.rel='noopener noreferrer';

}

function whatsappURL(numero){

let n=String(numero||'')
.replace(/\D/g,'');

if(n.length===10||n.length===11){
n='55'+n;
}

if(n.length<10||n.length>15){
return '';
}

return 'https://wa.me/'+n;

}

function instagramURL(valor){

let nome=String(valor||'').trim();

if(!nome)return '';

if(
nome.startsWith('https://')||
nome.startsWith('http://')
){

try{

const url=new URL(nome);

if(
url.hostname==='instagram.com'||
url.hostname==='www.instagram.com'
){

return url.href;

}

}catch(e){}

return '';

}

nome=nome.replace(
/^(www\.)?instagram\.com\//i,
''
).replace(/^@/,'');

if(!/^[a-zA-Z0-9._]+$/.test(nome)){
return '';
}

return 'https://www.instagram.com/'+nome;

}

function adicionarFoto(e,parent){

const url=urlSegura(e.foto);

if(!url)return;

const img=el('img','',parent);

img.src=url;

img.alt=e.nome||'Foto da empresa';

img.loading='lazy';

img.onerror=()=>img.remove();

}

function cards(lista,parent){

if(!lista.length){

el(
'p',
'Nenhum estabelecimento cadastrado ou encontrado.',
parent
);

return;

}

ordenar(lista).forEach(e=>{

const plano=planoAtivo(e);

const c=el('article','',parent);

c.className='entry';

if(plano==='premium'){

c.classList.add('premium-card');

const selo=el(
'div',
'⭐ PREMIUM',
c
);

selo.className='selo-premium';

}else if(plano==='profissional'){

c.classList.add('profissional-card');

const selo=el(
'div',
'★ EM DESTAQUE',
c
);

selo.className='selo-profissional';

}

adicionarFoto(e,c);

el('h3',e.nome,c);

if(cats[Number(e.categoria)]){

el(
'small',
cats[Number(e.categoria)],
c
);

}

if(e.descricao){

el('p',e.descricao,c);

}

if(e.endereco){

el('p','📍 '+e.endereco,c);

}

if(e.horario){

el('p','🕒 '+e.horario,c);

}

const contatos=el('div','',c);

contatos.className='contatos';

if(e.whatsapp){

link(
'💬 WhatsApp',
whatsappURL(e.whatsapp),
contatos
);

}

if(e.telefone){

const telefone=String(e.telefone)
.replace(/[^\d+]/g,'');

if(telefone){

const a=el(
'a',
'📞 Ligar',
contatos
);

a.href='tel:'+telefone;

}

}

if(e.endereco){

link(
'📍 Localização',
'https://www.google.com/maps/search/?api=1&query='+
encodeURIComponent(
e.endereco+' Lumiar Nova Friburgo'
),
contatos
);

}

if(
plano==='profissional'||
plano==='premium'
){

if(e.instagram){

link(
'📸 Instagram',
instagramURL(e.instagram),
contatos
);

}

if(e.site){

link(
'🌐 Site',
urlSegura(e.site),
contatos
);

}

}

const id=String(e.id);

const b=btn(
fav.includes(id)?
'♥ Favorito':'♡ Favoritar',
()=>{

fav=fav.includes(id)?
fav.filter(x=>x!==id):
[...fav,id];

try{

localStorage.setItem(
'lumiarFav',
JSON.stringify(fav)
);

}catch(err){}

if(mode==='fav'){

favorites();

}else{

b.textContent=fav.includes(id)?
'♥ Favorito':'♡ Favoritar';

}

},
c
);

});

}

function bannersPremium(parent){

const lista=ordenar(
empresas.filter(
e=>planoAtivo(e)==='premium'
)
);

if(!lista.length)return;

el(
'h2',
'⭐ Empresas patrocinadoras',
parent
);

lista.forEach(e=>{

const c=el('article','',parent);

c.className='publicidade';

el(
'small',
'PUBLICIDADE • PREMIUM',
c
);

el('h2',e.nome,c);

adicionarFoto(e,c);

if(e.descricao){

el('p',e.descricao,c);

}

btn(
'Conhecer empresa',
()=>{

listing(
e.nome,
[e],
'empresa'
);

},
c
);

const url=whatsappURL(e.whatsapp);

if(url){

btn(
'💬 Falar pelo WhatsApp',
()=>{

window.open(
url,
'_blank',
'noopener,noreferrer'
);

},
c
);

}

});

}

function home(){

mode='home';

reset();

search(render);

el('h2','Categorias');

const g=el('div');

g.className='grid';

const publicidade=el('section');

const results=el('section');

function render(q=''){

g.replaceChildren();

results.replaceChildren();

publicidade.replaceChildren();

cats.forEach((n,k)=>{

if(norm(n).includes(norm(q))){

const b=btn(
'',
()=>openCat(k),
g
);

b.className='cat';

el('span',icons[k],b);

el('div',n,b);

}

});

if(!q.trim()){

bannersPremium(publicidade);

}

const lista=empresas.filter(e=>

q.trim()?
corresponde(e,q):
planoAtivo(e)==='premium'

);

if(lista.length){

el(
'h2',
q.trim()?
'Resultados da pesquisa':
'Empresas em destaque',
results
);

cards(lista,results);

}else if(q.trim()){

el(
'p',
'Nenhuma empresa encontrada.',
results
);

}

}

render();

const banner=el('section');

banner.className='banner';

el(
'h2',
'Anuncie sua empresa',
banner
);

el(
'p',
'Divulgue seu negócio em Lumiar e região.',
banner
);

btn(
'Conheça nossos planos',
plans,
banner
);

btn(
'🏪 Cadastre sua empresa',
()=>{

window.location.href='comerciante.html';

},
banner
);

}

function listing(titulo,lista,m){

mode=m;

reset();

btn('← Voltar',home);

el('h2',titulo);

search(q=>render(q));

const r=el('section');

function render(q=''){

r.replaceChildren();

cards(
lista.filter(e=>corresponde(e,q)),
r
);

}

render();

}

function openCat(k){

let lista=empresas.filter(
e=>Number(e.categoria)===k
);

if(k===7){

lista=lista.filter(
e=>planoAtivo(e)!=='basico'
);

}

listing(
icons[k]+' '+cats[k],
lista,
'cat'
);

}

function explore(){

listing(
'Explorar Lumiar',
empresas,
'explore'
);

}

function favorites(){

listing(
'Meus favoritos',
empresas.filter(
e=>fav.includes(String(e.id))
),
'fav'
);

}

function profile(){

mode='profile';

reset();

btn('← Voltar',home);

el('h2','Perfil');

el(
'p',
'Você está navegando como visitante. Seus favoritos ficam neste navegador.'
);

const c=el('section');

c.className='entry';

el(
'h2',
'Área do comerciante',
c
);

el(
'p',
'Cadastre ou gerencie sua empresa.',
c
);

btn(
'Acessar minha empresa',
()=>{

window.location.href='comerciante.html';

},
c
);

btn(
'Conhecer planos comerciais',
plans,
c
);

}

function plans(){

mode='plans';

reset();

btn('← Voltar',home);

el('h2','Planos comerciais');

el(
'p',
'Sua empresa mais perto dos moradores e turistas de Lumiar.'
);

const planos=[

{
nome:'Básico',
valor:'19,90',
beneficios:[
'Cadastro comercial',
'Foto da empresa',
'WhatsApp e telefone',
'Localização e horário'
]
},

{
nome:'Profissional',
valor:'39,90',
beneficios:[
'Todos os benefícios do Básico',
'Instagram e site',
'Divulgação de promoções',
'Destaque na categoria'
]
},

{
nome:'Premium',
valor:'69,90',
beneficios:[
'Todos os benefícios do Profissional',
'Destaque na página inicial',
'Banner publicitário',
'Prioridade nas pesquisas'
]
}

];

planos.forEach(p=>{

const c=el('article');

c.className='plano';

if(p.nome==='Premium'){

c.classList.add('premium');

const selo=el(
'div',
'MÁXIMA VISIBILIDADE',
c
);

selo.className='selo';

}

el('h2',p.nome,c);

const preco=el(
'div',
'R$ '+p.valor,
c
);

preco.className='preco';

el('span',' /mês',preco);

const lista=el('ul','',c);

p.beneficios.forEach(item=>{

el('li','✓ '+item,lista);

});

btn(
'Cadastrar empresa',
()=>{

window.location.href='comerciante.html';

},
c
);

});

const aviso=el(
'p',
'Planos propostos para o lançamento comercial. Benefícios e contratação sujeitos à disponibilidade.'
);

aviso.className='aviso';

const banner=el('section');

banner.className='banner';

el(
'h2',
'Acesso gratuito',
banner
);

el(
'p',
'Moradores e turistas podem explorar o Lumiar Digital gratuitamente.',
banner
);

btn(
'Explorar Lumiar',
explore,
banner
);

}

el('p','Carregando Lumiar Digital...');

carregarEmpresas()

.then(()=>{

home();

})

.catch(erro=>{

console.error(erro);

home();

alert(
'Erro ao carregar empresas. Verifique a conexão ou tente novamente.'
);

});
// SISTEMA DE PROMOCOES

let promocoes = [];
let erroPromocoes = false;

function hojeLumiar(){
return new Intl.DateTimeFormat('en-CA',{
timeZone:'America/Sao_Paulo',
year:'numeric',
month:'2-digit',
day:'2-digit'
}).format(new Date());
}

async function carregarPromocoes(){

const hoje = hojeLumiar();

const campos = [
'id',
'empresa_id',
'titulo',
'descricao',
'foto',
'preco_original',
'preco_promocional',
'data_inicio',
'data_fim',
'aprovado',
'destaque'
].join(',');

try{

const resposta = await fetch(
'https://fhclimiwecgxmgigibix.supabase.co/rest/v1/promocoes?select='+campos+
'&aprovado=eq.true'+
'&data_inicio=lte.'+hoje+
'&data_fim=gte.'+hoje+
'&order=destaque.desc',
{
cache:'no-store',
headers:{
apikey:'sb_publishable_8aRbVy84r3kuuPQh_Owz5w_lHu6v_oQ'
}
}
);

if(!resposta.ok){
throw new Error('Erro ao carregar ofertas');
}

promocoes = await resposta.json();
erroPromocoes = false;

}catch(erro){

console.error(erro);
erroPromocoes = true;
promocoes = [];

}

}

function moedaPromocao(valor){

return Number(valor).toLocaleString(
'pt-BR',{
style:'currency',
currency:'BRL'
});

}

function dataPromocao(data){

return String(data||'')
.split('-').reverse().join('/');

}

function ofertasValidas(){

const hoje = hojeLumiar();

return promocoes.filter(p=>{

const empresa = empresas.find(e=>
String(e.id)===String(p.empresa_id)
);

return empresa &&
empresa.aprovado &&
p.aprovado &&
p.data_inicio<=hoje &&
p.data_fim>=hoje;

});

}

function mostrarPromocoes(lista,parent){

if(!lista.length){

el('p',
erroPromocoes?
'Não foi possível carregar as ofertas.':
'Nenhuma promoção disponível no momento.',
parent);

return;

}

lista.forEach(p=>{

const empresa = empresas.find(e=>
String(e.id)===String(p.empresa_id)
);

if(!empresa)return;

const card = el('article','',parent);

card.className = 'entry';

if(p.destaque){

card.classList.add('premium-card');

const selo = el(
'div','⭐ OFERTA EM DESTAQUE',card
);

selo.className='selo-premium';

}

adicionarFoto({
foto:p.foto,
nome:p.titulo
},card);

el('h2',p.titulo,card);

el('small',empresa.nome,card);

el('p',p.descricao,card);

const original = Number(p.preco_original);
const promocional = Number(p.preco_promocional);

if(original>0 && promocional>=0 &&
promocional<original){

const desconto = Math.round(
(1-promocional/original)*100
);

const selo = el(
'div',desconto+'% OFF',card
);

selo.style.cssText =
'background:#b83232;color:white;padding:8px;border-radius:8px;display:inline-block;font-weight:bold';

const antigo = el(
'p','De '+moedaPromocao(original),card
);

antigo.style.textDecoration='line-through';

}

if(p.preco_promocional!=null){

const preco = el(
'h2','Por '+moedaPromocao(promocional),card
);

preco.style.cssText =
'color:#194c36;font-size:28px';

}

el(
'p',
'📅 Válida até '+dataPromocao(p.data_fim),
card
);

const url = whatsappURL(empresa.whatsapp);

if(url){

const b = btn(
'💬 Aproveitar oferta',
()=>window.open(
url,'_blank','noopener,noreferrer'
),
card
);

b.style.cssText =
'width:100%;background:#194c36;color:white';

}

});

}

function paginaPromocoes(){

mode='promocoes';

reset();

btn('← Voltar',home);

el('h2','🏷️ Promoções e ofertas');

const busca = search(render);

busca.placeholder='Buscar promoções...';

const lista = el('section');

function render(q=''){

lista.replaceChildren();

mostrarPromocoes(
ofertasValidas().filter(p=>
norm(
(p.titulo||'')+' '+(p.descricao||'')
).includes(norm(q))
),
lista
);

}

render();

}

const openCatOriginal = openCat;

openCat = function(k){

if(k===7){

paginaPromocoes();

return;

}

openCatOriginal(k);

};

const homeOriginal = home;

home = function(){

homeOriginal();

const ofertas = ofertasValidas()
.filter(p=>p.destaque);

if(!ofertas.length)return;

const secao = document.createElement('section');

el('h2','🔥 Ofertas em destaque',secao);

mostrarPromocoes(ofertas,secao);

const b = btn(
'Ver todas as promoções',
paginaPromocoes,
secao
);

b.style.width='100%';

const grid = app.querySelector('.grid');

if(grid){

grid.after(secao);

}else{

app.append(secao);

}

const busca = app.querySelector(
'input[type="search"]'
);

if(busca){

busca.addEventListener('input',()=>{

secao.hidden=!!busca.value.trim();

});

}

};

carregarPromocoes().then(()=>{

if(mode==='home'){

home();

}else if(mode==='promocoes'){

paginaPromocoes();

}

});

// FIM DO SISTEMA DE PROMOCOES
</script>

</body>
</html>
